<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conroe ISD SSO</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#000}iframe{width:100vw;height:100vh;border:none}</style></head><body><iframe id="f" allowfullscreen webkitallowfullscreen mozallowfullscreen></iframe><script>
(function(){
  var u = new URLSearchParams(location.search).get('u') || '';
  var f = document.getElementById('f');
  function setTitle(){ try { document.title = decodeURIComponent(u.replace(/^https?:\/\//,'')).slice(0,60); } catch (e) {} }
  if (!u) { document.body.innerHTML = '<p style="color:#fff;font-family:sans-serif;text-align:center;margin-top:20vh">Missing game URL</p>'; return; }
  var host = '';
  try { host = new URL(u).host; } catch (e) {}
  var needsRebase = /^(cdn\.jsdelivr\.net|raw\.githubusercontent\.com)$/i.test(host);
  if (!needsRebase) { f.src = u; setTitle(); return; }
  fetch(u).then(function(resp){
    var ct = resp.headers.get('content-type') || '';
    if (!/text\/(html|plain)/i.test(ct)) throw new Error('not text');
    return resp.text().then(function(html){
      if (/<(?:!doctype|html|head|body|script|base)[\s>]/i.test(html.slice(0,2000))) return html;
      throw new Error('not html');
    });
  }).then(function(html){
    html = html.replace(/<meta[^>]*http-equiv=["']content-security-policy["'][^>]*>/gi, '');
    var base = u.substring(0, u.lastIndexOf('/') + 1);
    if (/<head[^>]*>/i.test(html)) html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + base + '">');
    else html = '<base href="' + base + '">' + html;
    f.srcdoc = html;
    setTitle();
  }).catch(function(){ f.src = u; setTitle(); });
})();
</script></body></html>
