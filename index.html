<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex, nofollow, noarchive">
	<title>Conroe ISD SSO</title>
	<style>
		html, body {
			margin: 0;
			height: 100%;
			background: #f4f6f8;
			font-family: Arial, Helvetica, sans-serif;
			overflow: hidden;
		}
		#frame {
			width: 100vw;
			height: 100vh;
			border: none;
			display: block;
		}
	</style>
</head>
<body>
	<iframe id="frame" allowfullscreen></iframe>
	<script>
		var appUrl = new URL('home.html', location.href).href;

		(function cloak() {
			try {
				history.replaceState(null, '', 'about:blank');
			} catch (e) {
				document.title = 'about:blank';
			}
			document.title = 'Conroe ISD SSO';
			document.getElementById('frame').src = appUrl;
		})();
	</script>
</body>
</html>
